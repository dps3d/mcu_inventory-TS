  <text x="520" y="232" fill="#FFFBF4" font-family="monospace" font-size="11">RP2040 QFN</text>

  <rect x="412" y="260" width="88" height="54" rx="6" fill="#2A2529" stroke="#3B82F6" stroke-width="1.5"/>
